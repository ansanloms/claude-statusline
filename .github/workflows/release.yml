name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify tag matches deno.json version
        run: |
          test "v$(jq -r .version deno.json)" = "${GITHUB_REF_NAME}"

      - run: deno task check
      - run: deno task lint
      - run: deno task test
      - run: deno task build

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/claude-statusline --generate-notes
